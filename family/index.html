<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Family Lesson</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Fredoka', sans-serif;
            overflow: hidden;
            background-image: url('home_page.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        #lesson-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .family-lineup {
            display: flex;
            align-items: flex-end; 
            justify-content: center;
            gap: 15px; 
            width: 90%;
            max-width: 1100px;
            /* Lifts them up so they aren't on the very edge */
            margin-bottom: 10vh; 
            z-index: 2;
        }

        .character {
            cursor: pointer;
            transition: all 0.5s ease-in-out;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            flex: 1;
            position: relative;
        }

        /* HEIGHT RATIOS: Making Father and Grandfather taller */
        #grandfather img, #father img { height: 50vh; }
        #grandmother img, #mother img { height: 46vh; }
        #brother img, #sister img     { height: 35vh; }
        #baby img                     { height: 25vh; }

        .character img {
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.2));
        }

        /* SMOOTH TRANSITION FOR FOCUS */
        .character.focused {
            z-index: 100 !important;
            position: absolute;
            left: 50% !important;
            transform: translateX(-50%);
            bottom: 5vh;
        }

        .character.focused img {
            height: 75vh !important; /* Everyone grows to the same focus size */
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.4));
        }

        /* FADE EFFECT */
        .family-lineup.fade-others .character:not(.focused) {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #subtitle-box {
            position: fixed;
            top: 5%; 
            width: 80%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 40px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            border: 6px solid white;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.4s ease;
            z-index: 1000;
            pointer-events: none;
        }

        #subtitle-box.show {
            opacity: 1;
            transform: translateY(0);
        }

        .text-en { font-size: 2.5rem; color: #111; margin: 0; font-weight: 600; }
        .highlight { color: #e63946; }

    </style>
</head>
<body>

<div id="lesson-container">
    <div id="subtitle-box">
        <p class="text-en" id="caption"></p>
    </div>

    <div class="family-lineup" id="lineup">
        <div class="character" id="grandfather" onclick="playMember('grandfather')"><img src="grandfather.png"></div>
        <div class="character" id="grandmother" onclick="playMember('grandmother')"><img src="grandmother.png"></div>
        <div class="character" id="father" onclick="playMember('father')"><img src="father.png"></div>
        <div class="character" id="mother" onclick="playMember('mother')"><img src="mother.png"></div>
        <div class="character" id="brother" onclick="playMember('brother')"><img src="brother.png"></div>
        <div class="character" id="sister" onclick="playMember('sister')"><img src="sister.png"></div>
        <div class="character" id="baby" onclick="playMember('baby')"><img src="baby.png"></div>
    </div>
</div>

<script>
    const familyMembers = {
        grandfather: { text: "Hi! I am grandfather. You can call me Grandpa. I am tall.", pitch: 0.3 },
        grandmother: { text: "Hi! I am grandmother. You can call me Grandma. I am tall.", pitch: 0.5 },
        father: { text: "Hi! I am father. You can call me Dad. I am tall.", pitch: 0.8 },
        mother: { text: "Hi! I am mother. You can call me Mom. I am tall.", pitch: 1.0 },
        brother: { text: "Hi! I am brother. I am short.", pitch: 1.5 },
        sister: { text: "Hi! I am sister. I am short.", pitch: 2.0 },
        baby: { text: "Hi! I am baby. I am short.", pitch: 2.5 }
    };

    const targetWords = ["grandfather", "grandmother", "mother", "father", "brother", "sister", "tall", "short"];

    function highlightText(text) {
        let highlighted = text;
        targetWords.forEach(word => {
            const regex = new RegExp(`\\b(${word})\\b`, 'gi');
            highlighted = highlighted.replace(regex, '<span class="highlight">$1</span>');
        });
        return highlighted;
    }

    function resetAll() {
        window.speechSynthesis.cancel();
        document.getElementById('lineup').classList.remove('fade-others');
        document.getElementById('subtitle-box').classList.remove('show');
        document.querySelectorAll('.character').forEach(c => {
            c.classList.remove('focused');
        });
    }

    function playMember(role) {
        // Immediate Reset for smooth clicking
        resetAll();

        const data = familyMembers[role];
        const lineup = document.getElementById('lineup');
        const box = document.getElementById('subtitle-box');
        const caption = document.getElementById('caption');
        const clickedChar = document.getElementById(role);
        
        // Timeout 0 allows the browser to process the 'reset' before focusing
        setTimeout(() => {
            lineup.classList.add('fade-others');
            clickedChar.classList.add('focused');
            caption.innerHTML = highlightText(data.text);
            box.classList.add('show');

            const msg = new SpeechSynthesisUtterance(data.text);
            msg.lang = 'en-US';
            msg.pitch = data.pitch;
            msg.rate = 0.8;

            msg.onend = () => {
                setTimeout(resetAll, 1000);
            };

            window.speechSynthesis.speak(msg);
        }, 10);
    }

    // Reset when clicking background
    document.getElementById('lesson-container').onclick = function(e) {
        if (e.target === this) {
            resetAll();
        }
    };
</script>
</body>
</html>
